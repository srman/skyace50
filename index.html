<script>

// ======================================================================
// 기본 설정
// ======================================================================
const W = 360, STEP = 1 / 60, MAXS = 200, LVMAX = 150;
const FONT = '-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif';
const MONO = 'Menlo, Consolas, "Courier New", monospace';
const cv = document.getElementById("c"), mainCtx = cv.getContext("2d", { alpha: false });
let ctx = mainCtx;
let H = 640, S = 1, offX = 0, offY = 0, dpr = 1, safeT = 0, safeB = 0;
let scene = "title", G = null, uiT = 0, TEST = false, FREEZE = false, nextStage = 1, resetArm = 0, toast = null, selRegion = 0, dirty = true;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = n => Math.floor(n).toLocaleString("en-US");
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash(i, j) { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); }
// 배열을 새로 만들지 않고 걸러 낸다 (쓰레기 수집을 줄여 배터리를 아낀다)
function compact(a, keep) { let j = 0; for (let i = 0; i < a.length; i++) { const v = a[i]; if (keep(v)) a[j++] = v; } a.length = j; }

// ======================================================================
// 저장 · 성장
// ======================================================================
const SAVE_KEY = "skyace50_v1";
const UPS = [
  { k: "atk", name: "공격력", desc: "모든 총알 피해 +15%", base: 60, max: 40, ex: 1.6 },
  { k: "rate", name: "연사 속도", desc: "발사 간격 7% 단축", base: 90, max: 10, ex: 2.0 },
  { k: "hp", name: "장갑", desc: "최대 체력 +25", base: 50, max: 40, ex: 1.6 },
  { k: "mag", name: "자석", desc: "코인을 끌어오는 범위 증가", base: 50, max: 5, ex: 2.0 },
  { k: "bomb", name: "폭탄 탑재", desc: "출격할 때 폭탄 +1", base: 150, max: 4, ex: 2.0 },
  { k: "wing", name: "호위기", desc: "함께 싸우는 보조기 (최대 2대)", base: 600, max: 2, ex: 2.0 },
];
function freshSave() {
  return { v: 1, unlocked: 1, gold: 0, xp: 0, lvl: 1, wl: 1, sound: true, saver: true,
    up: { atk: 0, rate: 0, hp: 0, mag: 0, bomb: 0, wing: 0 }, best: {}, cleared: {}, clear100: false, clear200: false };
}
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));

  } catch (e) {}

}
let SV = loadSave();
function persist() { if (TEST) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) {} }
function upCost(u) { return Math.round(u.base * Math.pow(1 + SV.up[u.k], u.ex) / 10) * 10; }
function buyUp(u) {
  if (SV.up[u.k] >= u.max) return false;
  const c = upCost(u); if (SV.gold < c) return false;
  SV.gold -= c; SV.up[u.k]++; persist(); return true;
}
function xpNeed(l) { return Math.round(20 + 14 * Math.pow(l, 1.5)); }
function maxHP() { return 100 + 25 * SV.up.hp + 4 * (SV.lvl - 1); }
function dmgBase() { return 10 * (1 + 0.15 * SV.up.atk) * (1 + 0.03 * (SV.lvl - 1)); }

function magR() { return 40 + 24 * SV.up.mag; }
function gainXP(n) {
  SV.xp += n; if (G) G.xpGot += n;
  while (SV.lvl < LVMAX && SV.xp >= xpNeed(SV.lvl)) {
    SV.xp -= xpNeed(SV.lvl); SV.lvl++;
    if (G && G.p && !G.p.dead) {
      G.p.hp = Math.min(maxHP(), G.p.hp + maxHP() * 0.25);
      floatText(G.p.x, G.p.y - 34, "LEVEL UP! Lv " + SV.lvl, "#7cff9b", 1.6); sfx("lvl");
    }
  }
  if (SV.lvl >= LVMAX) SV.xp = 0;
}

// ======================================================================
// 지역 (10곳 × 20판) · 난이도
// ======================================================================
const REGIONS = [

  { name: "산호 군도", sea: "#167f9b", sea2: "#2d9cb8", kind: "islands", foe: "#d38b2f", bomber: "#8b6f4a", ground: "boat", hull: ["#5d6e5a", "#8a9c84"] },
  { name: "붉은 사막", sea: "#c9a160", sea2: "#b48a4a", kind: "desert", foe: "#55703a", bomber: "#6a6f7a", ground: "tank", hull: ["#8a7a4a", "#a8955c"] },
  { name: "설원 산맥", sea: "#d5e0ea", sea2: "#b9c8d6", kind: "snow", foe: "#4f6488", bomber: "#5a6a7a", ground: "tank", hull: ["#6c7a8a", "#9aa8b8"] },
  { name: "폭풍의 밤바다", sea: "#0d1d38", sea2: "#1c3157", kind: "night", foe: "#9a46c0", bomber: "#5a3a6a", ground: "boat", hull: ["#3a3f52", "#5c6380"] },
  { name: "밀림의 강", sea: "#2f6b2a", sea2: "#3f8a37", kind: "jungle", foe: "#b5462e", bomber: "#6b5a3a", ground: "tank", hull: ["#55603a", "#7a8a52"] },
  { name: "화산 지대", sea: "#3b2622", sea2: "#5a2d22", kind: "volcano", foe: "#e0a030", bomber: "#4a3a3a", ground: "tank", hull: ["#4a3a36", "#6e5650"] },
  { name: "빙하 바다", sea: "#2a6f8f", sea2: "#8fd0e8", kind: "ice", foe: "#3b5ba5", bomber: "#6a7a8a", ground: "boat", hull: ["#61788c", "#93aec4"] },
  { name: "폐허 도시", sea: "#3d4148", sea2: "#4d525a", kind: "city", foe: "#8a8f3a", bomber: "#5a5f4a", ground: "tank", hull: ["#555a52", "#7d8478"] },
  { name: "성층권", sea: "#14245a", sea2: "#2e4590", kind: "stratos", foe: "#c0c0c8", bomber: "#3a3a4a", ground: null, hull: ["#30324a", "#555a78"] },
];
const regionIdx = s => Math.floor((s - 1) / 20);
function hpScale(s) { const k = s - 1; return 1 + 0.15 * k + 0.006 * k * k; }
function bulletSpd(s) { return 105 + 110 * (1 - Math.exp(-s / 60)); }
function enemyDmg(s) { return Math.round(8 + 0.5 * s); }
function fireF(s) { return 1 + Math.min(s, 120) * 0.015; }
function bossF(s) { return 1 + Math.min(s, 100) * 0.006; }

// ======================================================================
// 도트 그림 (처음 한 번만 만들어 두고 계속 재사용)
// ======================================================================
const PLANE = [
  ".......w", ".......w", "......kg", "......gc", "......gc", "kgggggGg", "gGGGGGgg",
  "kggggggg", "......gg", "......gg", "......gg", "....kggg", "...kgGgg", ".......k",
];
const FOE = [".....d", "...ddd", ".....r", ".....r", "drrrrr", "rRRRRr", "drrrrr", ".....r", ".....c", ".....r", ".....w"];
const ACE = ["....dd", "...ddd", ".....a", "....aa", "daaaaa", "aYYaaa", "daaaaa", "....aa", ".....c", ".....a", ".....Y"];
const BOMBER = [
  "...........d", ".........ddd", "...........b", "...........b", "...........b", "..bbbbbbbbbb",
  "bbEbbbbEbbbb", "bBBBBBBBBBbb", "...........b", "...........b", "..........cb", "..........cb",
  "...........b", "...........w",
];
function mkSprite(half, pal, sc) {
  const n = Math.max(...half.map(r => r.length));
  const rows = half.map(r => { r = r.padStart(n, "."); return r + [...r].reverse().join(""); });
  const c = document.createElement("canvas"); c.width = rows[0].length * sc; c.height = rows.length * sc;
  const g = c.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (ch === ".") return;
    const col = pal === "white" ? "#ffffff" : pal === "shadow" ? "rgba(0,0,0,0.28)" : pal[ch];
    if (col) { g.fillStyle = col; g.fillRect(x * sc, y * sc, sc, sc); }
  }));
  return c;
}
const PLP = { g: "#4caf50", G: "#2e7d32", k: "#1b3d1f", w: "#e0e0e0", c: "#81d4fa" };
const WINGP = { g: "#90a4ae", G: "#607d8b", k: "#263238", w: "#e0e0e0", c: "#81d4fa" };
const ACEP = { a: "#2b2b33", Y: "#ffca28", d: "#000000", c: "#ef5350" };
const NEMP = { a: "#16161c", Y: "#e53935", d: "#000000", c: "#ff8a80" };
const LEADP = { a: "#7b1f1f", Y: "#ffd54f", d: "#2a0a0a", c: "#90caf9" };
const KAMIP = { r: "#ff7043", R: "#ffe0b2", d: "#3e1a0a", c: "#ffeb3b", w: "#ffffff" };
const PL = {
  plane: mkSprite(PLANE, PLP, 2), planeS: mkSprite(PLANE, "shadow", 2), wing: mkSprite(PLANE, WINGP, 1),
  omega: mkSprite(ACE, NEMP, 7), omegaW: mkSprite(ACE, "white", 7),
  lead: mkSprite(ACE, LEADP, 3), leadW: mkSprite(ACE, "white", 3),
  kami: mkSprite(FOE, KAMIP, 2), kamiW: mkSprite(FOE, "white", 2), kamiS: mkSprite(FOE, "shadow", 2),
};
const SPR = {};
function spr(r) {
  if (SPR[r]) return SPR[r];
  const fp = { r: REGIONS[r].foe, R: "#ffe9a8", d: "#2a1d1d", c: "#8fd3ff", w: "#cfcfcf" };
  const bp = { b: REGIONS[r].bomber, B: "#d9d9c0", E: "#2b2b2b", c: "#8fd3ff", w: "#cfcfcf", d: "#222222" };
  SPR[r] = {
    fighter: mkSprite(FOE, fp, 2), fighterW: mkSprite(FOE, "white", 2), fighterS: mkSprite(FOE, "shadow", 2),
    ace: mkSprite(ACE, ACEP, 2), aceW: mkSprite(ACE, "white", 2), aceS: mkSprite(ACE, "shadow", 2),
    bomber: mkSprite(BOMBER, bp, 2), bomberW: mkSprite(BOMBER, "white", 2), bomberS: mkSprite(BOMBER, "shadow", 2),
    mid: mkSprite(BOMBER, bp, 4), midW: mkSprite(BOMBER, "white", 4),
  };
  return SPR[r];
}
function mkBullet(r, core, rim) {
  const s = Math.ceil(r * 2 + 5), c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d"), m = s / 2;
  const circ = (rr, col) => { g.fillStyle = col; g.beginPath(); g.arc(m, m, rr, 0, Math.PI * 2); g.fill(); };
  circ(r + 1.6, "#3a0010"); circ(r, rim); circ(r * 0.45, core);
  return c;
}
const BUL = { n: mkBullet(3.5, "#ffffff", "#ff3d6e"), big: mkBullet(6, "#ffffff", "#ff9100") };
const COINF = [0, 1, 2, 3, 4, 5].map(i => {
  const c = document.createElement("canvas"); c.width = 16; c.height = 16; const g = c.getContext("2d");
  const w = Math.abs(Math.cos(i / 6 * Math.PI)) * 5 + 1;
  g.fillStyle = "#8d6e00"; g.beginPath(); g.ellipse(8.6, 8.6, w + 1, 6.2, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#ffd54f"; g.beginPath(); g.ellipse(8, 8, w, 5.5, 0, 0, Math.PI * 2); g.fill();
  return c;
});

// ======================================================================
// 배경 (지역마다 바닥 무늬를 한 장 그려 두고 이어 붙여 스크롤)
// ======================================================================
const BG = { y: 0, world: 0, deco: [], next: 0, imgs: {}, tiles: {} };
function bgTile(r) {
  if (BG.tiles[r]) return BG.tiles[r];
  const c = document.createElement("canvas"); c.width = W; c.height = 560;
  const g = c.getContext("2d"), reg = REGIONS[r], R = rng(r * 31 + 7);
  g.fillStyle = reg.sea; g.fillRect(0, 0, W, 560);
  g.fillStyle = reg.sea2;
  for (let j = 0; j < 20; j++) for (let i = 0; i < 7; i++) { const h = hash(i, j); if (h < 0.5) g.fillRect(i * 52 + h * 44, j * 28 + h * 10, 8 + h * 18, 2); }
  if (reg.kind === "city") { g.fillStyle = "#2c2f34"; for (let y = 0; y < 560; y += 140) g.fillRect(0, y, W, 14); g.fillRect(110, 0, 12, 560); g.fillRect(250, 0, 12, 560); }
  if (reg.kind === "volcano") {
    g.strokeStyle = "#c2410c"; g.lineWidth = 2;
    for (let i = 0; i < 9; i++) { let x = R() * W, y = R() * 520; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (R() - 0.5) * 40; y += 8 + R() * 14; g.lineTo(x, y); } g.stroke(); }
  }
  if (reg.kind === "jungle") { g.fillStyle = "#3a6fa0"; g.fillRect(150, 0, 46, 560); g.fillStyle = "#4f86b8"; for (let y = 0; y < 560; y += 22) g.fillRect(160 + (y % 3) * 6, y, 10, 2); }
  if (reg.kind === "stratos") { g.fillStyle = "#ffffff"; for (let i = 0; i < 40; i++) g.fillRect(R() * W, R() * 560, 1.5, 1.5); }
  return (BG.tiles[r] = c);
}
function mkDeco(w, R) {
  const c = document.createElement("canvas"); c.width = 150; c.height = 120;
  const g = c.getContext("2d"), k = REGIONS[w].kind, blobs = [], n = 4 + Math.floor(R() * 5);
  for (let i = 0; i < n; i++) blobs.push([75 + (R() - 0.5) * 70, 60 + (R() - 0.5) * 50, 14 + R() * 20]);
  const circ = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const tri = (x, y, s, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.8, y + s * 0.6); g.lineTo(x - s * 0.8, y + s * 0.6); g.closePath(); g.fill(); };
  if (k === "desert") {
    blobs.forEach(b => circ(b[0] + 4, b[1] + 4, b[2], "#8a6234"));
    blobs.forEach(b => circ(b[0], b[1], b[2], "#b07f45"));
    blobs.forEach(b => circ(b[0] - b[2] * 0.3, b[1] - b[2] * 0.3, b[2] * 0.35, "#c99a5c"));
  } else if (k === "snow") {
    blobs.forEach(b => { tri(b[0], b[1], b[2] * 1.2, "#7d8794"); tri(b[0], b[1] - b[2] * 0.75, b[2] * 0.45, "#ffffff"); });
    for (let i = 0; i < 8; i++) tri(10 + R() * 130, 10 + R() * 100, 7, "#2e5b3a");
  } else if (k === "jungle") {
    blobs.forEach(b => circ(b[0], b[1], b[2] + 3, "#1f4d1c"));
    blobs.forEach(b => circ(b[0] - 3, b[1] - 3, b[2], "#2e6b27"));
    blobs.forEach(b => circ(b[0] - b[2] * 0.3, b[1] - b[2] * 0.3, b[2] * 0.4, "#4c9a3f"));
  } else if (k === "volcano") {
    blobs.forEach(b => circ(b[0] + 3, b[1] + 3, b[2], "#1e1311"));
    blobs.forEach(b => circ(b[0], b[1], b[2], "#4a2e28"));
    const m = blobs[0]; circ(m[0], m[1], m[2] * 0.45, "#ff6a00"); circ(m[0], m[1], m[2] * 0.22, "#ffd180");
  } else if (k === "ice") {
    blobs.forEach(b => {
      g.fillStyle = "#b3e0f2"; g.beginPath(); for (let a = 0; a < 6; a++) { const rr = b[2] * (0.8 + R() * 0.4), an = a / 6 * Math.PI * 2; g.lineTo(b[0] + Math.cos(an) * rr + 3, b[1] + Math.sin(an) * rr + 3); } g.fill();
      g.fillStyle = "#f2fbff"; g.beginPath(); for (let a = 0; a < 6; a++) { const rr = b[2] * (0.75 + R() * 0.3), an = a / 6 * Math.PI * 2; g.lineTo(b[0] + Math.cos(an) * rr, b[1] + Math.sin(an) * rr); } g.fill();
    });
  } else if (k === "city") {
    for (let i = 0; i < 5; i++) {
      const x = 10 + R() * 100, y = 10 + R() * 70, w2 = 22 + R() * 26, h2 = 22 + R() * 30;
      g.fillStyle = "#24272c"; g.fillRect(x + 4, y + 4, w2, h2); g.fillStyle = "#6b707a"; g.fillRect(x, y, w2, h2);
      g.fillStyle = "#555a63"; g.fillRect(x + 3, y + 3, w2 - 6, h2 - 6);
      for (let q = 0; q < 4; q++) if (R() < 0.6) { g.fillStyle = "#ffd54f"; g.fillRect(x + 5 + R() * (w2 - 10), y + 5 + R() * (h2 - 10), 2, 2); }
    }
  } else if (k === "stratos") {
    blobs.forEach(b => circ(b[0], b[1], b[2] + 6, "#c4d3f5")); blobs.forEach(b => circ(b[0] - 3, b[1] - 3, b[2], "#eef3ff"));
  } else {
    const night = k === "night";
    const sand = night ? "#24324a" : "#e9d8a6", gr = night ? "#14261c" : "#4f9d45", dk = night ? "#0d1a12" : "#2f7a32";
    blobs.forEach(b => circ(b[0], b[1], b[2] + 5, sand));
    blobs.forEach(b => circ(b[0], b[1], b[2], gr));
    blobs.forEach(b => circ(b[0] + b[2] * 0.25, b[1] + b[2] * 0.2, b[2] * 0.45, dk));
    if (night) for (let i = 0; i < 6; i++) circ(75 + (R() - 0.5) * 70, 60 + (R() - 0.5) * 40, 1.5, "#ffd54f");
  }
  return c;
}
function mkCloud(R) {
  const c = document.createElement("canvas"); c.width = 170; c.height = 100;
  const g = c.getContext("2d"); g.fillStyle = "#ffffff";
  for (let i = 0; i < 8; i++) { g.beginPath(); g.arc(30 + R() * 110, 35 + R() * 30, 14 + R() * 18, 0, Math.PI * 2); g.fill(); }
  return c;
}
function decoImgs(w) {
  if (!BG.imgs[w]) BG.imgs[w] = { ground: [0, 1, 2, 3].map(i => mkDeco(w, rng(w * 100 + i + 1))), cloud: [0, 1, 2].map(i => mkCloud(rng(900 + i))) };
  return BG.imgs[w];
}
function updBg(dt, scroll) {
  BG.y += scroll * dt;
  const imgs = decoImgs(BG.world), k = REGIONS[BG.world].kind;
  BG.next -= dt;
  if (BG.next <= 0) {
    const cloud = Math.random() < (k === "night" ? 0.5 : k === "stratos" ? 0.15 : 0.35);
    BG.deco.push({ img: cloud ? imgs.cloud[Math.floor(Math.random() * 3)] : imgs.ground[Math.floor(Math.random() * 4)],
      cloud, x: rnd(-30, W + 30), y: -130, sp: cloud ? 1.7 : 1, a: cloud ? (k === "night" ? 0.16 : 0.4) : 1 });
    BG.next = k === "islands" || k === "city" ? rnd(1.2, 2.6) : rnd(2.2, 4.8);
  }
  for (const d of BG.deco) d.y += scroll * d.sp * dt;
  compact(BG.deco, d => d.y < H + 20);
}
function drawBgBase() {
  const t = bgTile(BG.world), off = BG.y % 560;
  for (let y = off - 560; y < H; y += 560) ctx.drawImage(t, 0, 0, W, 560, 0, y, W, 561);
  for (const d of BG.deco) if (!d.cloud) ctx.drawImage(d.img, d.x - d.img.width / 2, d.y);
}
function drawClouds() {
  for (const d of BG.deco) if (d.cloud) { ctx.globalAlpha = d.a; ctx.drawImage(d.img, d.x - d.img.width / 2, d.y); }
  ctx.globalAlpha = 1;

function botMove(dt) {

  row("경험치", "+" + fmt(g.xpGot) + " XP", "#7cff9b");
  row("점수", fmt(g.score) + (g.newBest ? " ★" : ""), g.newBest ? "#ff8a80" : "#ffffff");
  row("조종사 레벨", "Lv " + SV.lvl, "#7cff9b");
  row("보유 골드", fmt(SV.gold) + " G", "#ffd54f");
  y = top + 330 + 14;
  const ns = Math.min(MAXS, g.stage + 1);
  btn("rhangar", 30, y, W - 60, 48, "격납고에서 강화 → STAGE " + ns, () => { nextStage = ns; go("hangar"); }, { size: 16 }); y += 56;
  btn("rnext", 30, y, W - 60, 46, "바로 다음 스테이지 ▶", () => startStage(ns), { size: 15, color: "#c62828", border: "#ffcdd2" }); y += 54;
  btn("rtitle", 30, y, W - 60, 38, "타이틀", () => go("title"), { size: 14, color: "#263238" });
}
function drawOver() {
  const g = G; dim(0.62);
  const top = Math.max(safeT + 30, H * 0.14);
  panel(16, top, W - 32, 250);
  txt("격추당했습니다", W / 2, top + 34, 25, "#ff5252");
  txt("STAGE " + g.stage + (g.boss ? " · 보스전에서 격추" : " · 보스 전에 격추"), W / 2, top + 66, 13, "#cfd8dc");
  let y = top + 98;
  txt("골드 절반 보존  +" + fmt(g.kept) + " G", W / 2, y, 15, "#ffd54f"); y += 26;
  txt("경험치 유지  Lv " + SV.lvl, W / 2, y, 15, "#7cff9b"); y += 26;
  txt("무기 단계 " + SV.wl + "/5", W / 2, y, 13, "#ff8a80"); y += 30;
  wrap("TIP · " + TIPS[g.stage % TIPS.length], 34, y, W - 68, 18, 12, "#e3f2fd");
  y = top + 264;
  btn("oretry", 30, y, W - 60, 50, "다시 도전 ▶", () => startStage(g.stage), { size: 18, color: "#c62828", border: "#ffcdd2" }); y += 60;
  btn("ohangar", 30, y, W - 60, 46, "격납고에서 강화하기", () => { nextStage = g.stage; go("hangar"); }); y += 56;
  btn("otitle", 30, y, W - 60, 40, "타이틀", () => go("title"), { size: 14, color: "#263238" });
}
function drawEnding(mid) {
  drawBgBase(); drawClouds(); dim(0.45);
  let y = safeT + Math.max(40, H * 0.1);
  txt(mid ? "STAGE 100 CLEAR!" : "ALL CLEAR!", W / 2, y, mid ? 28 : 34, "#ffd54f", "center", true, MONO); y += 46;
  txt(mid ? "첫 번째 최종 보스를 쓰러뜨렸습니다" : "200개 스테이지를 모두 돌파했습니다", W / 2, y, 16, "#ffffff"); y += 40;
  ctx.drawImage(PL.plane, W / 2 - 16, y + Math.sin(uiT * 3) * 4); y += 60;
  const lines = mid
    ? ["천공 요새 아틀라스가 구름 아래로 가라앉습니다.", "하지만 폭풍 너머, 더 깊은 하늘에서", "검은 날개의 그림자가 움직이기 시작했습니다.", "", "남은 100판 — 진짜 끝은 200판에 있습니다.", "", "조종사 Lv " + SV.lvl + " · 보유 " + fmt(SV.gold) + "G"]
    : ["흑룡 네메시스 Ω가 성층권 아래로 떨어지고,", "하늘에 다시 아침 해가 떴습니다.", "", "당신은 이제 진짜 SKY ACE입니다.", "", "조종사 Lv " + SV.lvl + " · 보유 " + fmt(SV.gold) + "G", "모든 스테이지를 다시 도전할 수 있습니다."];
  for (const l of lines) { txt(l, W / 2, y, 14, "#e3f2fd"); y += 24; }
  if (mid) btn("mnext", 60, H - safeB - 128, W - 120, 50, "STAGE 101로 ▶", () => { nextStage = 101; go("hangar"); }, { size: 17, color: "#c62828", border: "#ffcdd2" });
  btn("etitle", 60, H - safeB - 68, W - 120, 46, "타이틀로", () => go("title"), { size: 16 });
}

// ======================================================================
// 그리기 · 루프 (필요할 때만 깨어나서 그린다)
// ======================================================================
const PERF = { frames: 0, js: 0 };
function draw() {
  ui.next = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (offX > 0.5 || offY > 0.5) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.setTransform(S * dpr, 0, 0, S * dpr, offX * dpr, offY * dpr);
  ctx.imageSmoothingEnabled = false;
  if (G && (scene === "play" || scene === "pause" || scene === "result" || scene === "over")) drawGame();
  if (scene === "title") drawTitle();
  else if (scene === "help") drawHelp();
  else if (scene === "select") drawSelect();
  else if (scene === "hangar") drawHangar();
  else if (scene === "pause") drawPause();
  else if (scene === "result") drawResult();
  else if (scene === "over") drawOver();
  else if (scene === "ending") drawEnding(false);
  else if (scene === "midend") drawEnding(true);
  if (toast) {
    ctx.globalAlpha = clamp(toast.t * 3, 0, 1);
    ctx.font = "bold 13px " + FONT; const w = ctx.measureText(toast.s).width + 30;
    ctx.fillStyle = "rgba(0,0,0,0.8)"; rr(W / 2 - w / 2, H * 0.5 - 18, w, 36, 18); ctx.fill();
    txt(toast.s, W / 2, H * 0.5, 13, "#ffffff"); ctx.globalAlpha = 1;
  }
  ui.btns = ui.next;
}
// 장면별 목표 화면 갱신 횟수 (0 = 바뀔 때만 그림)
function targetFps() {
  if (scene === "play") return SV.saver ? 30 : 60;
  if (scene === "title" || scene === "ending" || scene === "midend") return SV.saver ? 12 : 24;
  return toast ? 15 : 0;
}
let last = 0, acc = 0, scheduled = false;
function wake() { dirty = true; schedule(); }
function schedule() {
  if (scheduled || document.hidden) return;
  scheduled = true;
  const fps = targetFps();
  if (fps >= 60 || fps === 0) requestAnimationFrame(tick);
  else setTimeout(() => requestAnimationFrame(tick), Math.max(0, 1000 / fps - 6));
}
function tick(now) {
  scheduled = false;
  const t0 = performance.now();
  let dt = last ? (now - last) / 1000 : STEP; last = now;
  if (dt > 0.25) dt = 0.25;
  if (!FREEZE) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
    if (n >= 10) acc = 0;
  }
  const fps = targetFps();
  if (fps > 0 || dirty) { draw(); dirty = false; PERF.frames++; }
  PERF.js += performance.now() - t0;
  if (fps > 0) schedule(); else { last = 0; acc = 0; }
}

// ======================================================================
// 입력
// ======================================================================
const inp = { dragId: null, lx: 0, ly: 0, dx: 0, dy: 0, downBtn: null, btnPid: null };
const key = { l: 0, r: 0, u: 0, d: 0 };
function toLogical(e) { return [(e.clientX - offX) / S, (e.clientY - offY) / S]; }
function hitBtn(x, y) {
  for (let i = ui.btns.length - 1; i >= 0; i--) { const b = ui.btns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); unlockAudio();
  const [x, y] = toLogical(e), b = hitBtn(x, y);
  if (b) {
    if (b.instant) { if (b.cb) b.cb(); wake(); return; }
    inp.downBtn = b.id; inp.btnPid = e.pointerId; wake(); return;
  }
  if (scene === "play" && inp.dragId === null) { inp.dragId = e.pointerId; inp.lx = x; inp.ly = y; }
}, { passive: false });
cv.addEventListener("pointermove", e => {
  if (e.pointerId !== inp.dragId) return;
  e.preventDefault();
  const [x, y] = toLogical(e); inp.dx += x - inp.lx; inp.dy += y - inp.ly; inp.lx = x; inp.ly = y;
}, { passive: false });
function pointerEnd(e) {
  if (e.pointerId === inp.dragId) inp.dragId = null;
  if (e.pointerId === inp.btnPid) {
    const [x, y] = toLogical(e), b = hitBtn(x, y);
    if (b && b.id === inp.downBtn && b.cb) b.cb();
    inp.downBtn = null; inp.btnPid = null; wake();
  }
}
cv.addEventListener("pointerup", pointerEnd);
cv.addEventListener("pointercancel", e => { if (e.pointerId === inp.dragId) inp.dragId = null; if (e.pointerId === inp.btnPid) { inp.downBtn = null; inp.btnPid = null; wake(); } });
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
const KM = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r", ArrowUp: "u", KeyW: "u", ArrowDown: "d", KeyS: "d" };
addEventListener("keydown", e => {
  unlockAudio();
  if (KM[e.code]) { key[KM[e.code]] = 1; e.preventDefault(); }
  else if ((e.code === "Space" || e.code === "KeyX") && scene === "play") { useBomb(); e.preventDefault(); }
  else if (e.code === "KeyP" || e.code === "Escape") { if (scene === "play") go("pause"); else if (scene === "pause") go("play"); }
  wake();
});
addEventListener("keyup", e => { if (KM[e.code]) key[KM[e.code]] = 0; });
addEventListener("blur", () => { key.l = key.r = key.u = key.d = 0; });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (scene === "play") go("pause"); persist(); }
  audioPolicy(); if (!document.hidden) { last = 0; wake(); }
});

// ======================================================================
// 테스트 도구 (자동 플레이 검증용)
// ======================================================================
window.__T = {
  run(stage, o) {
    o = o || {}; TEST = true; newGame(stage); G.god = !!o.god; G.bot = o.bot !== false; G.skill = o.skill === undefined ? 1 : o.skill; scene = "play";
    const maxN = (o.maxT || 600) * 60; let n = 0;
    while (!G.finished && n < maxN) { update(STEP); n++; }
    return { stage, cleared: scene === "result" || scene === "ending" || scene === "midend", t: +(n / 60).toFixed(1), hits: G.hitsTaken,
      dmg: Math.round(G.dmgTaken), maxhp: maxHP(), kills: G.kills, gold: G.goldGot + (G.bonus || 0), lvl: SV.lvl,
      wl: G.p.wl, bossT: G.bossT ? +G.bossT.toFixed(1) : null, maxEb: G.maxEb, timeout: !G.finished };
  },
  shop() {
    for (;;) {
      const c = UPS.filter(u => SV.up[u.k] < u.max && upCost(u) <= SV.gold).sort((a, b) => upCost(a) - upCost(b))[0];
      if (!c) break; buyUp(c);
    }
  },
  campaign(o) {
    o = o || {}; TEST = true; SV = freshSave();
    const out = []; let s = o.from || 1, tries = 0, total = 0; const to = o.to || MAXS;
    while (s <= to && total < (o.maxRuns || 900)) {
      const r = this.run(s, o); r.try = ++tries; total++; this.shop(); r.ups = Object.values(SV.up).reduce((a, b) => a + b, 0); out.push(r);
      if (r.cleared) { s++; tries = 0; } else if (tries >= (o.maxTries || 10)) break;
    }
    return { reached: s, runs: total, lvl: SV.lvl, gold: SV.gold, up: Object.assign({}, SV.up), wl: SV.wl, out };
  },
  peek(stage, sec, o) {
    o = o || {}; TEST = true; newGame(stage); G.god = true; G.bot = true; G.skill = 1; scene = "play";
    for (let i = 0; i < sec * 60 && !G.finished; i++) update(STEP);
    if (o.bossAt !== undefined && G.boss) G.boss.hp = G.boss.maxhp * o.bossAt;
    G.bot = !!o.keepBot; TEST = false; FREEZE = !!o.freeze; wake(); return { scene, boss: G.boss && G.boss.name, eb: G.eb.length, en: G.en.length };
  },
  setSave(p) { SV = Object.assign(freshSave(), p); },
  scene(s) { go(s); },
  btnAt(id) { const b = ui.btns.find(b => b.id === id); return b ? [(b.x + b.w / 2) * S + offX, (b.y + b.h / 2) * S + offY] : null; },
  state() { return { scene, stage: G && G.stage, px: G && Math.round(G.p.x), py: G && Math.round(G.p.y), bombs: G && G.p.bombs, gold: SV.gold, up: SV.up.atk, H, S: +S.toFixed(3), dpr, saver: SV.saver }; },
  perf() { const r = { frames: PERF.frames, js: +PERF.js.toFixed(1), px: cv.width * cv.height }; PERF.frames = 0; PERF.js = 0; return r; },
  bosses() { const o = []; for (let s = 1; s <= MAXS; s++) o.push(s + ":" + bossInfo(s).name); return o; },
};

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, SV.saver ? 1.5 : 2);
  H = clamp(Math.round(W * vh / vw), 560, 860);
  S = Math.min(vw / W, vh / H);
  offX = (vw - W * S) / 2; offY = (vh - H * S) / 2;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  const cs = getComputedStyle(document.getElementById("sa"));
  safeT = Math.max(0, ((parseFloat(cs.paddingTop) || 0) - offY) / S);
  safeB = Math.max(0, ((parseFloat(cs.paddingBottom) || 0) - offY) / S);
  if (G && G.p) { G.p.x = clamp(G.p.x, 14, W - 14); G.p.y = clamp(G.p.y, safeT + 70, H - safeB - 24); }
  hud.key = ""; wake();
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 250));
nextStage = SV.clear200 ? MAXS : SV.unlocked;
wake();
</script>
