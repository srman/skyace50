<script>

function rng(seed) {

// ======================================================================
// 저장 · 성장

function saveCode(sv) {
  const j = JSON.stringify(sv || SV);

function upCost(u) { return Math.round(u.base * Math.pow(1 + SV.up[u.k], u.ex) / 10) * 10; }
function buyUp(u) {
  if (SV.up[u.k] >= u.max) return false;

  SV.gold -= c; SV.up[u.k]++; persist(); return true;
}
function xpNeed(l) { return Math.round(20 + 14 * Math.pow(l, 1.5)); }
function maxHP() { return 100 + wingHP() + 4 * (SV.lvl - 1); }
function dmgBase() { return 10 * gunMul() * (1 + 0.03 * (SV.lvl - 1)); }

// ======================================================================
// 기체 파츠 — 등급(Mk1~Mk5)마다 성능과 모양이 달라지고, 같은 등급 안에서 +10까지 강화
// ======================================================================
const TIERS = [
  { n: "Mk1", col: "#e0e0e0", lv: 1, gold: 0, parts: 0 },
  { n: "Mk2", col: "#69f0ae", lv: 12, gold: 1000, parts: 5 },
  { n: "Mk3", col: "#40c4ff", lv: 35, gold: 5000, parts: 15 },
  { n: "Mk4", col: "#e040fb", lv: 65, gold: 15000, parts: 35 },
  { n: "Mk5", col: "#ffd740", lv: 95, gold: 40000, parts: 70 },

const POD_T1 = { n: "Mk1", col: "#e0e0e0", lv: 5, gold: 300, parts: 0 };
const ENH_MAX = 10, ENH_BASE = [15, 60, 180, 450, 900];
const SLOTS = [
  { k: "gun", name: "주포", names: ["7.7mm 기관총", "12.7mm 중기관총", "20mm 기관포", "30mm 리볼버포", "플라즈마 캐논"] },
  { k: "eng", name: "엔진", names: ["피스톤 엔진", "슈퍼차저 엔진", "터보프롭 엔진", "제트 엔진", "애프터버너"] },
  { k: "wing", name: "날개", names: ["직선 날개", "강화 날개", "후퇴익", "델타익", "카나드 델타익"] },
  { k: "arm", name: "장갑", names: ["알루미늄 장갑", "강철 장갑", "티타늄 장갑", "복합 장갑", "에너지 장갑"] },
  { k: "pod", name: "미사일", names: ["소형 유도탄", "쌍발 유도탄", "유도탄 포드", "대형 유도탄 포드", "스웜 미사일"] },
];
function freshParts() { return { gun: { t: 1, k: 0 }, eng: { t: 1, k: 0 }, wing: { t: 1, k: 0 }, arm: { t: 1, k: 0 }, pod: { t: 0, k: 0 } }; }
function PT(k) { return SV.parts[k]; }
function gunMul(p) { p = p || PT("gun"); return [1, 1.6, 2.5, 3.6, 5.2][p.t - 1] * (1 + 0.04 * p.k); }
function engMul(p) { p = p || PT("eng"); return [1, 0.88, 0.78, 0.68, 0.6][p.t - 1] * (1 - 0.01 * p.k); }
function wingHP(p) { p = p || PT("wing"); return [0, 120, 280, 480, 720][p.t - 1] + 12 * p.k; }
function armPct(p) { p = p || PT("arm"); return [0, 8, 15, 22, 30][p.t - 1] + 0.6 * p.k; }
function podSpec(p) {
  p = p || PT("pod"); if (!p.t) return null; const i = p.t - 1;
  return { n: [1, 2, 2, 4, 4][i], int: [1.2, 1.0, 0.8, 0.8, 0.6][i] * (1 - 0.02 * p.k), d: [2, 2, 3, 3, 3.5][i] };
}
function slotEffect(k, p) {
  switch (k) {
    case "gun": return "총알 피해 ×" + gunMul(p).toFixed(2);
    case "eng": return "연사 속도 +" + Math.round((1 / engMul(p) - 1) * 100) + "%";
    case "wing": return "체력 +" + wingHP(p) + (p.t >= 3 ? "·기관총" : "");
    case "arm": return "받는 피해 -" + armPct(p).toFixed(1) + "%";
    case "pod": { const q = podSpec(p); return q ? "유도탄 " + q.n + "발·" + q.int.toFixed(2) + "초" : "장착 안 됨"; }
  }
}
function nextTier(k) { const p = PT(k); if (p.t >= 5) return null; return k === "pod" && p.t === 0 ? POD_T1 : TIERS[p.t]; }
function craft(k) {
  const n = nextTier(k);
  if (!n || SV.lvl < n.lv || SV.gold < n.gold || SV.scrap < n.parts) return false;
  SV.gold -= n.gold; SV.scrap -= n.parts; const p = PT(k); p.t++; p.k = 0; persist(); return true;
}
function enhCost(k) { const p = PT(k); return p.t ? ENH_BASE[p.t - 1] * (p.k + 1) : 0; }
function enhance(k) {
  const p = PT(k); if (!p.t || p.k >= ENH_MAX) return false;
  const c = enhCost(k); if (SV.gold < c) return false;
  SV.gold -= c; p.k++; persist(); return true;
}
function power() {
  const q = podSpec(), side = PT("wing").t >= 3 ? 0.14 : 0;
  return Math.round(dmgBase() / fireInt() * (1 + side + (q ? q.n * q.d / q.int * 0.02 : 0)) + maxHP() * 0.6 / (1 - armPct() / 100));
}
// ======================================================================
// 내 기체 — F-16에서 출발해 파츠 등급에 따라 미래형 전투기로 진화한다 (위에서 본 모습, 좌우 대칭)
// ======================================================================
const JET_NAMES = ["F-16 바이퍼", "F-16XL 개량형", "F-22 랩터형", "6세대 스텔스", "SKY ACE 미래형"];
const SKIN = [
  { b: "#a9b3ba", d: "#7d8790", l: "#d3dade", ln: "#68727a", can: "#8fd0ff", glow: null, acc: null },
  { b: "#7f8a92", d: "#5a646c", l: "#a6b0b7", ln: "#47515a", can: "#8fd0ff", glow: null, acc: "#c62828" },
  { b: "#5f6b78", d: "#434d58", l: "#808c99", ln: "#353e47", can: "#d4a537", glow: null, acc: "#ffca28" },
  { b: "#2e2f3a", d: "#1b1c24", l: "#4a4b5c", ln: "#5e44c4", can: "#d4a537", glow: "#b388ff", acc: "#b388ff" },
  { b: "#e6ebf2", d: "#aebac8", l: "#ffffff", ln: "#8fd8e4", can: "#00e5ff", glow: "#00e5ff", acc: "#ffd740" },
];
const FLAME = [["#ffcc80", "#ff9800"], ["#ffe082", "#ff6f00"], ["#b3e5fc", "#29b6f6"], ["#e1bee7", "#ab47bc"], ["#ffffff", "#00e5ff"]];
const BCOL = ["#fff59d", "#ffcc80", "#80deea", "#ea80fc", "#fff176"];
const tierSet = t => ({ gun: { t, k: 0 }, eng: { t, k: 0 }, wing: { t, k: 0 }, arm: { t, k: 0 }, pod: { t, k: 0 } });
function avgTier(P) { P = P || SV.parts; return (P.gun.t + P.eng.t + P.wing.t + P.arm.t) / 4; }
function modelName(P) { return JET_NAMES[clamp(Math.floor(avgTier(P) + 0.001), 1, 5) - 1]; }
function jetGeom(P) {
  const w = P.wing.t, e = P.eng.t, gT = P.gun.t, rearW = e >= 3 ? 5.4 : 3.6;
  const nose = [
    [[0, -27], [1.2, -24], [2.2, -20], [2.8, -15]],
    [[0, -29], [1.1, -26], [2.2, -21], [2.9, -15]],
    [[0, -28], [1.9, -25], [3.4, -20], [3.8, -15]],
    [[0, -29], [2, -25.5], [3.6, -20], [4, -15]],
    [[0, -31], [1, -27.5], [2.6, -21.5], [3.8, -15]],
  ][gT - 1];
  const body = nose.concat([[Math.max(3.3, nose[3][0]), -8], [Math.max(3.6, rearW * 0.85), 4], [rearW, 14], [rearW - 0.2, 20], [rearW - 0.9, 23.5]]);
  const wing = [
    [[3.4, -2], [14.5, 7], [14.5, 10], [3.6, 10]],
    [[3.2, -12], [7, -3], [16, 9], [16, 12], [3.6, 13]],
    [[3.6, -4], [15, 8], [15, 11.5], [11, 13], [4, 12]],
    [[4, -2], [16, 10], [16, 13], [4.6, 14]],

function symPath(g, half) {

function jetMissile(g, x, y, len, col, flat) {

function drawJet(g, P, opt) {

      g.strokeStyle = "#1c1f23"; g.lineWidth = 0.2; g.beginPath(); for (let i = 1; i < 4; i++) { g.moveTo(x - w / 2 + i * w / 4, 22); g.lineTo(x - w / 2 + i * w / 4, 25.6); } g.stroke();

    g.globalAlpha = 0.5; g.fillStyle = sk.l; g.beginPath(); g.ellipse(-1, -1, 0.9, 19, 0, 0, Math.PI * 2); g.fill();

    if (P.wing.t <= 2) { bothPath(g, [[2.8, -14], [3.5, -2], [6.6, -2]]); g.fillStyle = sk.b; g.fill(); g.strokeStyle = sk.ln; g.lineWidth = 0.25; g.stroke(); }
    else { g.strokeStyle = sk.l; g.lineWidth = 0.3; g.beginPath(); for (const sgn of [1, -1]) { g.moveTo(J.nose[3][0] * sgn, -15); g.lineTo(J.wing[0][0] * sgn, J.wing[0][1]); } g.stroke(); }

    if (P.eng.t <= 2) { g.fillStyle = "#3a3f45"; g.beginPath(); g.ellipse(0, -2.5, 1.5, 0.9, 0, 0, Math.PI * 2); g.fill(); }

  }

function updEnemy(e, dt) {
  e.t += dt; if (e.flash > 0) e.flash -= dt;
  const s = G.stage, p = G.p;
  switch (e.kind) {
    case "fighter": e.y += e.vy * dt; e.x = e.x0 + (e.amp ? e.amp * Math.sin(e.t * e.freq) : 0); break;
    case "side": e.vy = 25 + 60 * Math.cos(e.t * 2.4); e.x += e.vx * dt; e.y += e.vy * dt; break;
    case "diver":
      if (!e.go) {
        e.y += (e.ty - e.y) * Math.min(1, dt * 2.5);
        if (e.t > 1.3) {
          e.go = true; const a = Math.atan2(p.y - e.y, p.x - e.x), sp = 200 + Math.min(s, 120) * 2;
          e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;
          if (G.state === "play" && !p.dead) aimed(e, 1, 0);
        }
      } else { e.x += e.vx * dt; e.y += e.vy * dt; }
      break;
    case "ground": e.y += G.scroll * dt; break;
    case "bomber":
      if (e.t < 13) { e.y += (110 - e.y) * Math.min(1, dt * 0.8); e.x = e.x0 + 50 * Math.sin(e.t * 0.6); } else e.y += 60 * dt;
      break;
    case "ace":
      if (e.t > 14) { e.y += 160 * dt; break; }
      if (e.tx === undefined || e.t > e.next) { e.tx = 30 + Math.random() * (W - 60); e.ty = 50 + Math.random() * 180; e.next = e.t + 1.6; }
      e.x += (e.tx - e.x) * Math.min(1, dt * 2.2); e.y += (e.ty - e.y) * Math.min(1, dt * 2.2);
      break;
    case "heli":
      if (e.t < 1.6) e.y += (e.ty - e.y) * Math.min(1, dt * 2);
      else if (e.t < 8) e.x += Math.sin(e.t * 0.9) * 22 * dt;
      else e.y += 90 * dt;
      break;
    case "kami": {
      if (e.t < e.delay) break;
      const sp = Math.min(260, 170 + s * 0.6);
      let a = e.vx || e.vy ? Math.atan2(e.vy, e.vx) : Math.PI / 2;
      if (e.t - e.delay < 3.5 && !p.dead) {
        let da = Math.atan2(p.y - e.y, p.x - e.x) - a;
        while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
        a += clamp(da, -2.2 * dt, 2.2 * dt);
      }
      e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp; e.x += e.vx * dt; e.y += e.vy * dt;
      break;
    }
    case "mine": e.y += 40 * dt; e.x += Math.sin(e.t * 1.3) * 12 * dt; break;
    case "gunship": e.x += e.vx * dt; e.y += Math.sin(e.t) * 6 * dt; break;
  }
  e.fireT -= dt;
  if (e.fireT <= 0 && e.y > 10 && e.y < H * 0.75 && G.state === "play" && !p.dead) fireEnemy(e);
}
function fireEnemy(e) {
  const s = G.stage, f = fireF(s);
  switch (e.kind) {
    case "fighter": if (e.shooter || Math.random() < 0.55 + Math.min(s, 40) * 0.01) aimed(e, 1, 0); e.fireT = (2.0 + Math.random() * 1.4) / f; break;
    case "side": if (Math.random() < 0.5 + Math.min(s, 40) * 0.01) aimed(e, 1, 0); e.fireT = (1.8 + Math.random()) / f; break;
    case "ground": aimed(e, s >= 20 ? 2 : 1, 0.18); e.fireT = (2.0 + Math.random()) / f; break;
    case "bomber":
      e.burst = (e.burst || 0) + 1;
      if (e.burst % 2) fan(e.x, e.y + 8, 5 + Math.min(4, Math.floor(s / 12)), 0.9, bulletSpd(s) * 0.85); else aimed(e, 3, 0.2);
      e.fireT = 1.5 / f; break;
    case "ace": aimed(e, 3, 0.22); e.fireT = 1.2 / f; break;
    case "heli": {
      if (e.t < 1.6 || e.t > 8) { e.fireT = 0.4; break; }
      const n = s >= 60 ? 8 : 6; e.rot = (e.rot || 0) + 0.3;

function targetFps() {
  if (scene === "play") return 60;
  if (scene === "title" || scene === "ending" || scene === "midend") return SV.saver ? 12 : 24;
  if (scene === "jet") return SV.saver ? 15 : 24;

}

}
function tick(now) {

  if (fps >= 60 && lastDraw && now - lastDraw < 14 && !dirty) { schedule(); return; }
  if (!FREEZE) { while (acc > 0.0005) { const st = Math.min(acc, 1 / 30); update(st); acc -= st; } }

function toLogical(e) { return [(e.clientX - offX) / S, (e.clientY - offY) / S]; }
function hitBtn(x, y) {
  for (let i = ui.btns.length - 1; i >= 0; i--) { const b = ui.btns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; }
  return null;
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); unlockAudio();
  const [x, y] = toLogical(e), b = hitBtn(x, y);
  if (b) {
    if (b.instant) { if (b.cb) b.cb(); wake(); return; }
    inp.downBtn = b.id; inp.btnPid = e.pointerId; wake(); return;
  }
  if (scene === "play" && inp.dragId === null) { inp.dragId = e.pointerId; inp.lx = x; inp.ly = y; }
}, { passive: false });
cv.addEventListener("pointermove", e => {
  if (e.pointerId !== inp.dragId) return;
  e.preventDefault();
  const [x, y] = toLogical(e); inp.dx += x - inp.lx; inp.dy += y - inp.ly; inp.lx = x; inp.ly = y;
}, { passive: false });
function pointerEnd(e) {
  if (e.pointerId === inp.dragId) inp.dragId = null;
  if (e.pointerId === inp.btnPid) {
    const [x, y] = toLogical(e), b = hitBtn(x, y);
    if (b && b.id === inp.downBtn && b.cb) b.cb();
    inp.downBtn = null; inp.btnPid = null; wake();
  }
}
cv.addEventListener("pointerup", pointerEnd);
cv.addEventListener("pointercancel", e => { if (e.pointerId === inp.dragId) inp.dragId = null; if (e.pointerId === inp.btnPid) { inp.downBtn = null; inp.btnPid = null; wake(); } });
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());
const KM = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r", ArrowUp: "u", KeyW: "u", ArrowDown: "d", KeyS: "d" };
addEventListener("keydown", e => {
  unlockAudio();
  if (KM[e.code]) { key[KM[e.code]] = 1; e.preventDefault(); }
  else if ((e.code === "Space" || e.code === "KeyX") && scene === "play") { useBomb(); e.preventDefault(); }
  else if (e.code === "KeyP" || e.code === "Escape") { if (scene === "play") go("pause"); else if (scene === "pause") go("play"); }
  wake();
});
addEventListener("keyup", e => { if (KM[e.code]) key[KM[e.code]] = 0; });
addEventListener("blur", () => { key.l = key.r = key.u = key.d = 0; });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (scene === "play") go("pause"); persist(); }
  audioPolicy(); if (!document.hidden) { last = 0; wake(); }
});

// ======================================================================
// 테스트 도구 (자동 플레이 검증용)
// ======================================================================
window.__T = {
  run(stage, o) {
    o = o || {}; TEST = true; newGame(stage); G.god = !!o.god; G.bot = o.bot !== false; G.skill = o.skill === undefined ? 1 : o.skill; scene = "play";
    const maxN = (o.maxT || 600) * 60; let n = 0;
    while (!G.finished && n < maxN) { update(STEP); n++; }
    return { stage, cleared: scene === "result" || scene === "ending" || scene === "midend", t: +(n / 60).toFixed(1), hits: G.hitsTaken,
      dmg: Math.round(G.dmgTaken), maxhp: maxHP(), kills: G.kills, gold: G.goldGot + (G.bonus || 0), lvl: SV.lvl,
      wl: G.p.wl, bossT: G.bossT ? +G.bossT.toFixed(1) : null, maxEb: G.maxEb, timeout: !G.finished };
  },
  shop() {
    for (let guard = 0; guard < 400; guard++) {
      const want = SLOTS.map(sl => ({ k: sl.k, n: nextTier(sl.k) })).filter(o => o.n && SV.lvl >= o.n.lv && SV.scrap >= o.n.parts).sort((a, b) => a.n.gold - b.n.gold)[0];
      if (want) { if (craft(want.k)) continue; }
      const opts = [];
      for (const sl of SLOTS) { const p = PT(sl.k); if (p.t && p.k < ENH_MAX) opts.push({ c: enhCost(sl.k), f: () => enhance(sl.k) }); }
      for (const u of UPS) if (SV.up[u.k] < u.max) opts.push({ c: upCost(u), f: () => buyUp(u) });
      const budget = SV.gold - (want ? want.n.gold : 0);
      const o = opts.filter(o => o.c <= budget).sort((a, b) => a.c - b.c)[0];
      if (!o) break; o.f();
    }
  },
  campaign(o) {
    o = o || {}; TEST = true; SV = freshSave();
    const out = []; let s = o.from || 1, tries = 0, total = 0; const to = o.to || MAXS;
    while (s <= to && total < (o.maxRuns || 900)) {
      const r = this.run(s, o); r.try = ++tries; total++; this.shop(); r.ups = SLOTS.map(sl => PT(sl.k).t + "." + PT(sl.k).k).join(" "); r.scrap = SV.scrap; out.push(r);
      if (r.cleared) { s++; tries = 0; } else if (tries >= (o.maxTries || 10)) break;
    }
    return { reached: s, runs: total, lvl: SV.lvl, gold: SV.gold, up: Object.assign({}, SV.up), wl: SV.wl, out };
  },
  peek(stage, sec, o) {
    o = o || {}; TEST = true; newGame(stage); G.god = true; G.bot = true; G.skill = 1; scene = "play";
    for (let i = 0; i < sec * 60 && !G.finished; i++) update(STEP);
    if (o.bossAt !== undefined && G.boss) G.boss.hp = G.boss.maxhp * o.bossAt;
    G.bot = !!o.keepBot; TEST = false; FREEZE = !!o.freeze; wake(); return { scene, boss: G.boss && G.boss.name, eb: G.eb.length, en: G.en.length };
  },
  setSave(p) { SV = Object.assign(freshSave(), p); JET.key = ""; },
  scene(s) { go(s); },
  btnAt(id) { const b = ui.btns.find(b => b.id === id); return b ? [(b.x + b.w / 2) * S + offX, (b.y + b.h / 2) * S + offY] : null; },
  state() { return { scene, stage: G && G.stage, px: G && Math.round(G.p.x), py: G && Math.round(G.p.y), bombs: G && G.p.bombs, gold: SV.gold, parts: JSON.stringify(SV.parts), scrap: SV.scrap, H, S: +S.toFixed(3), dpr, saver: SV.saver }; },
  perf() { const r = { frames: PERF.frames, js: +PERF.js.toFixed(1), px: cv.width * cv.height }; PERF.frames = 0; PERF.js = 0; return r; },
  bosses() { const o = []; for (let s = 1; s <= MAXS; s++) o.push(s + ":" + bossInfo(s).name); return o; },
};

function resize() {
  // 홈 화면 앱(아이폰)에서는 화면 높이가 짧게 보고되는 경우가 있어 실제 화면 크기와 비교해 큰 값을 쓴다
  cv.style.width = cv.style.height = "";
  const rect = cv.getBoundingClientRect();
  let vw = rect.width || window.innerWidth, vh = Math.max(rect.height, window.innerHeight, document.documentElement.clientHeight);
  const standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (standalone && screen.height > screen.width && vh < vw * 3 && Math.abs(screen.width - vw) < 2) vh = Math.max(vh, screen.height);
  dpr = Math.min(window.devicePixelRatio || 1, SV.saver ? 1.5 : 2);
  H = clamp(Math.round(W * vh / vw), 560, 860);
  S = Math.min(vw / W, vh / H);
  offX = (vw - W * S) / 2; offY = (vh - H * S) / 2;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  const cs = getComputedStyle(document.getElementById("sa"));
  safeT = Math.max(0, ((parseFloat(cs.paddingTop) || 0) - offY) / S);
  safeB = Math.max(0, ((parseFloat(cs.paddingBottom) || 0) - offY) / S);
  if (G && G.p) { G.p.x = clamp(G.p.x, 14, W - 14); G.p.y = clamp(G.p.y, safeT + 70, H - safeB - 24); }
  hud.key = ""; for (const k in MSPR) delete MSPR[k]; wake();
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 250));
// 아이폰 홈 화면 앱은 실행 직후 화면 크기를 늦게 알려 주는 경우가 있어 몇 번 더 맞춘다
[150, 600, 1500].forEach(ms => setTimeout(resize, ms));
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(resize, 200); });
nextStage = SV.clear200 ? MAXS : SV.unlocked;
if (SV.refund) { toast = { s: "강화가 파츠 시스템으로 바뀌어 " + fmt(SV.refund) + "G를 돌려드렸습니다", t: 4 }; delete SV.refund; persist(); }
wake();
</script>
